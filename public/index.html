<!DOCTYPE html>
<html lang="en" data-theme="light"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Attrition + TA Dashboard (Live)</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#eef4f3;--cd:#fff;--tx:#17262b;--mu:#5f7377;--bd:#d9e4e2;--ac:#0f766e;--rd:#e11d48;--am:#f59e0b;--gr:#16a34a;--heat:244,114,94;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-family:Arial,Helvetica,sans-serif}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1514;--cd:#16201f;--tx:#e6f0ee;--mu:#8fa5a1;--bd:#263534;--ac:#2dd4bf;--rd:#fb7185;--am:#fbbf24;--gr:#4ade80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1514;--cd:#16201f;--tx:#e6f0ee;--mu:#8fa5a1;--bd:#263534;--ac:#2dd4bf;--rd:#fb7185;--am:#fbbf24;--gr:#4ade80;color-scheme:dark}
html,body{margin:0;background:var(--bg);color:var(--tx)}*{box-sizing:border-box}
.lg{width:48px;height:48px;border-radius:12px;background:#fff;padding:7px;object-fit:contain;box-shadow:0 2px 8px rgba(0,0,0,.25);flex:none}header{display:flex;align-items:center;gap:14px;padding:14px 16px;background:linear-gradient(120deg,#0f766e,#155e75 60%,#4f46e5);color:#fff;margin-bottom:10px}h1{margin:0;font-size:21px;letter-spacing:.2px}h1 small{display:block;font-size:12px;color:rgba(255,255,255,.82);font-weight:400;margin-top:3px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px}
select,.up,.tb button,.mr{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx);cursor:pointer}
.up{display:inline-block;border-style:dashed}
.tb{display:flex;gap:8px;padding:4px 16px 8px;overflow-x:auto}.tb button{white-space:nowrap;font-weight:600;--tc:#0f766e;border-color:var(--tc);color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--cd))}.tb button:nth-child(2){--tc:#4f46e5}.tb button:nth-child(3){--tc:#7c3aed}.tb button:nth-child(4){--tc:#d97706}.tb button:nth-child(5){--tc:#e11d48}.tb button:nth-child(6){--tc:#0284c7}.tb button:hover{background:color-mix(in srgb,var(--tc) 20%,var(--cd))}.tb button.on{background:var(--tc);color:#fff;border-color:var(--tc);box-shadow:0 3px 10px color-mix(in srgb,var(--tc) 40%,transparent)}
main{padding:12px 16px 28px;max-width:1500px;margin:auto}
.g{display:grid;gap:12px;margin-bottom:12px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.w{grid-template-columns:repeat(auto-fit,minmax(min(420px,100%),1fr))}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;min-width:0}
.cd h3{margin:0 0 10px;font-size:16px;font-weight:800;color:var(--ac);letter-spacing:.2px}.cd h3 span{font-weight:400;color:var(--mu);font-size:12px;margin-left:6px}
.kv{font-size:26px;font-weight:700;margin:2px 0}.kl{font-size:12px;color:var(--mu)}.ks{font-size:11px;color:var(--mu)}
.cv{position:relative;height:290px}.ov{overflow:auto;max-height:560px}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:6px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap;vertical-align:middle;font-variant-numeric:tabular-nums}
th{color:var(--mu);font-weight:600;font-size:11.5px;position:sticky;top:0;background:var(--cd);z-index:2}th:first-child,td:first-child,th.tx,td.tx{text-align:left}th.ce,td.ce{text-align:center}th.rt,td.rt{text-align:right}
td.nm{max-width:230px;overflow:hidden;text-overflow:ellipsis}
td.bar{position:relative;min-width:105px;text-align:right}td.bar i{position:absolute;left:0;top:3px;bottom:3px;background:var(--ac);opacity:.25;border-radius:3px}td.bar b{position:relative}
td.ht{text-align:right;min-width:48px}th.sel{color:var(--tx);box-shadow:inset 0 -2px var(--ac)}tr.sel td{font-weight:700}
.mr{margin-top:8px;font-size:12px}ul{margin:0;padding-left:18px;font-size:13px;line-height:1.6}
.lk{color:var(--ac);cursor:pointer;text-decoration:underline;font-weight:600}#md{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:50;padding:calc(env(safe-area-inset-top,0px) + 12px) 10px calc(env(safe-area-inset-bottom,0px) + 10px)}#md.on{display:flex}#md .pn{background:var(--cd);border:1px solid var(--bd);border-radius:12px;margin:auto;width:min(1400px,100%);max-height:100%;display:flex;flex-direction:column;padding:12px 14px}#md .bd{overflow:auto}#md input{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}td.tx{text-align:left}tr.fh td{font-weight:700;background:rgba(15,118,110,.12)}
.xb{float:right;margin:-4px 0 0}.xp{background:var(--ac)!important;color:#fff!important;border:1px solid var(--ac)!important}.g.k .cd{--kc:#0f766e;border-top:4px solid var(--kc);background:linear-gradient(160deg,color-mix(in srgb,var(--kc) 15%,var(--cd)),var(--cd) 78%)}.g.k .cd .kv{color:var(--kc)}.g.k .cd:nth-child(6n+2){--kc:#4f46e5}.g.k .cd:nth-child(6n+3){--kc:#d97706}.g.k .cd:nth-child(6n+4){--kc:#e11d48}.g.k .cd:nth-child(6n+5){--kc:#0284c7}.g.k .cd:nth-child(6n+6){--kc:#7c3aed}.g2 thead tr:nth-child(2) th{top:31px}.cd h3::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ac);margin-right:8px}tbody tr:nth-child(even):not(.fh) td:not(.ht){background:color-mix(in srgb,var(--ac) 5%,transparent)}thead th{border-bottom:2px solid var(--ac)}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}@keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes fi{from{opacity:0}to{opacity:1}}
.cd{animation:up .35s ease both;transition:box-shadow .2s,border-color .2s}.cd:hover{box-shadow:0 4px 16px rgba(0,0,0,.12);border-color:var(--ac)}
.g>.cd:nth-child(2){animation-delay:.04s}.g>.cd:nth-child(3){animation-delay:.08s}.g>.cd:nth-child(4){animation-delay:.12s}.g>.cd:nth-child(5){animation-delay:.16s}.g>.cd:nth-child(n+6){animation-delay:.2s}
td.bar i{transform-origin:left;animation:gr .8s ease both}td.ht{animation:fi .8s ease both}tbody tr:hover td.tx,tbody tr:hover td.nm,tbody tr:hover td:first-child{background:rgba(127,127,127,.12)}
.lk{transition:opacity .15s}.lk:hover{opacity:.7}.tb button{transition:background .2s}#md.on .pn{animation:up .25s ease both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.fn{font-size:11.5px;color:var(--mu);line-height:1.5;margin-top:6px}
.tb button:nth-child(7){--tc:#ea580c}body.ta .ctl{display:none}
.tf{display:flex;align-items:center;gap:10px;margin:7px 0}.tf .n{width:88px;font-size:12px;color:var(--mu);font-weight:700}.tf .t{flex:1;display:flex;justify-content:center}.tf .f{height:28px;border-radius:8px;min-width:6px;display:flex;overflow:hidden;background:var(--c);transition:width .4s}.tf .f i{display:block;height:100%}.tf .v{width:118px;text-align:right;font-size:12px;color:var(--mu)}.tf .v b{color:var(--tx);font-size:14px}
.tlg{display:flex;gap:14px;font-size:11px;color:var(--mu);margin:0 0 6px 98px;flex-wrap:wrap}.tlg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.tfl{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end;margin:6px 0 10px}.tfl label{font-size:11px;color:var(--mu)}.tfl label:not(.up) select,.tfl label:not(.up) input{display:block;margin-top:2px;max-width:170px;font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--cd);color:var(--tx)}.tfl .up{align-self:flex-end}
@media(max-width:700px){.tf .n{width:64px}.tf .v{width:96px}.tlg{margin-left:0}}
/* report heading bars */
.cd>h3{margin:-12px -14px 12px;padding:10px 14px;border-radius:11px 11px 0 0;background:color-mix(in srgb,var(--hc) 14%,var(--cd));border-bottom:2px solid color-mix(in srgb,var(--hc) 45%,var(--cd));border-left:5px solid var(--hc);color:color-mix(in srgb,var(--hc) 78%,var(--tx));line-height:1.5}
.cd>h3::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--hc);box-shadow:0 0 0 3px color-mix(in srgb,var(--hc) 28%,transparent);margin-right:9px;vertical-align:1px}
.cd>h3 .xb{margin:-3px 0 0}
.cd{--hc:var(--ac)}.cd thead th{background:color-mix(in srgb,var(--hc) 11%,var(--cd));color:color-mix(in srgb,var(--hc) 60%,var(--tx));border-bottom:2px solid var(--hc)}
/* split card: chart + table */
.sp2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(380px,100%),1fr));align-items:start}
tr.gh td{font-weight:700;background:color-mix(in srgb,var(--gc) 13%,var(--cd))!important}tr.gh td:first-child{box-shadow:inset 4px 0 var(--gc);color:color-mix(in srgb,var(--gc) 75%,var(--tx))}
td.sub{padding-left:24px;color:var(--tx);max-width:340px;overflow:hidden;text-overflow:ellipsis}
td.sub::before{content:"• ";color:var(--mu)}
.tot{display:inline-block;margin-left:8px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:700;background:var(--hc);color:#fff;vertical-align:1px}
</style></head><body>

/* ===== live data from server.js (/api/sheet/:key) ===== */
async function getSheet(key,fresh){const r=await fetch('/api/sheet/'+key+(fresh?'?fresh=1':''),{cache:'no-store'});let j=null;try{j=await r.json()}catch(e){}
 if(!r.ok||!j||!j.sheets)throw new Error((j&&j.error)||('server error '+r.status));return j}
let ASIG='';

async function atSync(first,fresh){try{const d=await getSheet('attrition',fresh),sg=JSON.stringify(d.sheets);
 if(!first&&sg===ASIG){SRC.at=d.fetchedAt;stat();return}
 const tabs=d.sheets.map(x=>x.rows).filter(s=>s.length&&(s[0]||[]).some(h=>T(h).toLowerCase()=='date of joining'));
 if(!tabs.length)throw new Error('no tab with a "Date Of Joining" column in row 1');
 tabs.forEach(s=>{const k=s[0].findIndex(h=>T(h).toLowerCase()=='recruiter');if(k>=0)for(let i=1;i<s.length;i++)if(!T(s[i][k]))s[i][k]='Old Data'});
 const keep=ALL.length?SELS.map(s=>[s,$(s).value]):null;ASOF=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/D);const rows=build(tabs);
 if(!rows.length)throw new Error('no employee rows found - check the Date Of Joining column');
 const total=tabs.reduce((n,s)=>n+s.slice(1).filter(r=>r.some(c=>T(c))).length,0);
 ASIG=sg;ALL=rows;SRC={at:d.fetchedAt,skip:Math.max(0,total-rows.length)};init();
 if(keep){keep.forEach(([s,v])=>{const e=$(s);if(e&&e.options&&[...e.options].some(o=>o.value==v))e.value=v});periodOpts();keep.forEach(([s,v])=>{const e=$(s);if(e&&e.options&&[...e.options].some(o=>o.value==v))e.value=v});render()}}
 catch(e){if(!ALL.length){$('#src').textContent='⚠ '+e.message;$('#body').innerHTML='<div class="cd"><h3>Could not load the attrition sheet</h3><div class="fn">'+esc(e.message)+'<br>Retrying every '+REF+' seconds.</div></div>'}
  else $('#src').textContent='⚠ Sync failed at '+new Date().toLocaleTimeString('en-GB')+' ('+e.message+') · showing last data, will retry'}}
